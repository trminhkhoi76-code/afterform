<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage the AFTERFORM catalog, orders and inventory.">
  <meta name="theme-color" content="#22231b">
  <title>Store desk · AFTERFORM</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
  <script defer src="data.js"></script>
  <script defer src="admin-seed.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#admin-main">Skip to content</a>
  <div class="admin-shell">
    <aside class="rail" aria-label="Administration">
      <a class="rail-brand" href="#overview" aria-label="AFTERFORM store desk overview">
        <span class="brand-mark" aria-hidden="true">A<span>F</span></span>
        <span class="rail-brand-name">AFTERFORM<span>STORE DESK</span></span>
      </a>
      <nav class="rail-nav" id="admin-nav" aria-label="Store desk"></nav>
      <div class="rail-bottom">
        <a class="store-link" href="index.html"><span data-icon="store"></span>Visit storefront</a>
        <div class="workspace-state"><span class="workspace-indicator"></span><span>Demo workspace</span></div>
      </div>
    </aside>
    <div class="admin-stage">
      <header class="topbar">
        <button class="icon-button rail-toggle" type="button" aria-label="Open store desk navigation" aria-expanded="false" aria-controls="admin-nav"><span data-icon="menu"></span></button>
        <div class="crumb"><span>Store desk</span><span aria-hidden="true">/</span><strong id="admin-crumb">Overview</strong></div>
        <a class="top-store" href="index.html"><span data-icon="store"></span>Storefront</a>
        <span class="workspace-avatar" aria-label="Afterform workspace">AF</span>
      </header>
      <main class="admin-main" id="admin-main" tabindex="-1"></main>
      <footer class="admin-footer">AFTERFORM Store desk <span>USD</span></footer>
    </div>
  </div>
  <dialog id="admin-dialog" class="admin-dialog"></dialog>
  <div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>
  <noscript>This store desk needs JavaScript to display the demo catalog and orders.</noscript>
</body>
</html>
